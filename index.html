<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>RPG</title>
	<script>

        const gamedata = {
            "player_x": 5.0,
            "player_y": 8.0,
            "flags": [],
            "state": {
                "event_queue": [
                    { "type": "dialogue", "left": "john", "right": "mary", "speaker": "left", "text": "Hi Mary!" },
                    { "type": "dialogue", "left": "john", "right": "mary", "speaker": "right", "text": "Hi John!" },
                    { "type": "choice", "choices": [
                        {
                            "text": "Eat an apple",
                            "event_queue": [
                                { "type": "dialogue", "left": "john", "right": "mary", "text": "You picked eat an apple!" }
                            ]
                        },
                        {
                            "text": "Eat an orange",
                            "event_queue": [
                                { "type": "dialogue", "left": "john", "right": "mary", "text": "You picked eat an orange..." },
                                { "type": "dialogue", "left": "john", "right": "mary", "text": "I don't like oranges..." }
                            ]
                        },
                    ] },
                    { "type": "dialogue", "left": "john", "right": "mary", "text": "And then a meteor hit the planet..." }
                ]
            },
            "sprites": {
                "https://upload.wikimedia.org/wikipedia/en/d/db/Undertale_Combat_Example.png": ""
            }
        };

		let render;

		function start() {

            for (key of Object.keys(gamedata.sprites))
                gamedata.sprites[key] = document.getElementById(key);

			render = document.getElementById("canvas").getContext("2d");

            setInterval(update, 1000 / 60);

			document.addEventListener("keydown", (event) => {

				if (event.key === ' ') {

                    // repeatedly remove and process states until we reach a dialogue or something
                    if (gamedata.state.event_queue.length != 0) {

					    gamedata.state.event_queue.splice(0, 1);

                        while (gamedata.state.event_queue.length != 0 && gamedata.state.event_queue[0].type != "dialogue") {

                            const event = gamedata.state.event_queue[0];

                            if (event.type == "choice") {

                                // just pick the first choice by default for now
                                // insert selected choice's event queue into event queue
                                gamedata.state.event_queue.splice(1, 0, ...event.choices[0].event_queue);
                            }

                            gamedata.state.event_queue.splice(0, 1);
                        }
                    }
				}
			});
		}

        function update() {

            // clear
            render.fillStyle = "black";
            render.fillRect(0, 0, 256, 192);

            if (gamedata.state.event_queue.length == 0) {

                // an empty event queue means we're in "map navigation" mode

            } else {

                const event = gamedata.state.event_queue[0];

                if (event.type == "dialogue") {
                    drawDialogue(event);
                }
            }

            // test
            render.drawImage(gamedata.sprites[Object.keys(gamedata.sprites)[0]], 10, 10, 80, 80);
        }

        function drawDialogue(dialogueEvent) {

            render.fillStyle = "black";
            render.lineWidth = "2";
            render.strokeStyle = "white";
            render.font = "12px monospace";

            render.fillRect(4, 138, 248, 50);
            render.strokeRect(4, 138, 248, 50);

            render.fillStyle = "white";
            render.fillText(dialogueEvent.text, 10, 156);

            if (dialogueEvent.speaker == "left") {

                const nameplate_width = dialogueEvent.left.length * 6 + 20;

                render.fillStyle = "black";
                render.fillRect(4, 113, nameplate_width, 25);
                render.strokeRect(4, 113, nameplate_width, 25);

                render.fillStyle = "white";
                render.fillText(dialogueEvent.left, 10, 131);

            } else if (dialogueEvent.speaker == "right") {

                const nameplate_width = dialogueEvent.right.length * 6 + 20;

                render.fillStyle = "black";
                render.fillRect(252 - nameplate_width, 113, nameplate_width, 25);
                render.strokeRect(252 - nameplate_width, 113, nameplate_width, 25);

                render.fillStyle = "white";
                render.fillText(dialogueEvent.right, 258 - nameplate_width, 131);
            }
        }
	</script>
</head>
<body onload="start();" style="margin: 0; justify-content: center; display: flex;">

    <script>
        // get the browser to load all the images
        for (key of Object.keys(gamedata.sprites))
            document.write(`<img src="${ key }" id="${ key }" style="display: none;">`); 
    </script>

    <canvas id="canvas" width="256" height="192" style="height: 100vh; margin: 0; image-rendering: pixelated;"></canvas>

</body>
</html>
