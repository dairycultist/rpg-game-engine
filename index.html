<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>RPG</title>
	<script>

        const gamedata = {
            "player_x": 5.0,
            "player_y": 8.0,
            "flags": [],
            "state": {
                "event_queue": [
                    { "type": "dialogue", "left": "john", "right": "mary", "speaker": "left", "text": "Hi Mary!" },
                    { "type": "dialogue", "left": "john", "right": "mary", "speaker": "right", "text": "Hi John!" },
                    { "type": "choice", "choices": [
                        {
                            "text": "Eat an apple",
                            "event_queue": [
                                { "type": "dialogue", "left": "john", "right": "mary", "text": "You picked eat an apple!" }
                            ]
                        },
                        {
                            "text": "Eat an orange",
                            "event_queue": [
                                { "type": "dialogue", "left": "john", "right": "mary", "text": "You picked eat an orange..." },
                                { "type": "dialogue", "left": "john", "right": "mary", "text": "I don't like oranges..." }
                            ]
                        },
                    ] },
                    { "type": "dialogue", "left": "john", "right": "mary", "text": "And then a meteor hit the planet..." }
                ]
            },
            "sprites": {
                "https://upload.wikimedia.org/wikipedia/en/d/db/Undertale_Combat_Example.png": ""
            }
        };

		let render;

		function start() {

            for (key of Object.keys(gamedata.sprites))
                gamedata.sprites[key] = document.getElementById(key);

			render = document.getElementById("canvas").getContext("2d");

            setInterval(update, 1000 / 60);

			document.addEventListener("keydown", (event) => {

                if (gamedata.state.event_queue[0].type == "choice") {

                    if (event.key == "ArrowUp") {
                        
                        gamedata.state.event_queue[0].selected_i--;

                        if (gamedata.state.event_queue[0].selected_i < 0)
                            gamedata.state.event_queue[0].selected_i = gamedata.state.event_queue[0].choices.length - 1;
                    }

                    if (event.key == "ArrowDown") {
                        
                        gamedata.state.event_queue[0].selected_i++;

                        if (gamedata.state.event_queue[0].selected_i >= gamedata.state.event_queue[0].choices.length)
                            gamedata.state.event_queue[0].selected_i = 0;
                    }
                }
                
                if (event.key === ' ' && gamedata.state.event_queue.length != 0) {

                    const removed_event = gamedata.state.event_queue.splice(0, 1)[0];

                    if (removed_event.type == "choice") {
                    
                        // insert selected choice's event queue into event queue
                        gamedata.state.event_queue.splice(0, 0, ...removed_event.choices[removed_event.selected_i].event_queue);
                    }

                    // move to the next "display" event. some events are "process" events that
                    // change the state but which we aren't supposed to stick around on

                    while (gamedata.state.event_queue.length != 0) {

                        const event = gamedata.state.event_queue[0];

                        if (event.type == "dialogue") {
                            break;
                        } else if (event.type == "choice") {
                            event.selected_i = 0;
                            break;
                        } else if (event.type == "set_flag") {

                        } else if (event.type == "if") {

                        }

                        gamedata.state.event_queue.splice(0, 1);
                    }
				}
			});
		}

        function update() {

            // clear
            render.fillStyle = "black";
            render.fillRect(0, 0, 256, 192);

            if (gamedata.state.event_queue.length == 0) {

                // an empty event queue means we're in "map navigation" mode

            } else {

                const event = gamedata.state.event_queue[0];

                if (event.type == "dialogue") {
                    drawDialogue(event);
                } else if (event.type == "choice") {
                    drawChoice(event);
                }
            }

            // test
            render.drawImage(gamedata.sprites[Object.keys(gamedata.sprites)[0]], 10, 10, 80, 80);
        }

        function drawDialogue(event) {

            render.fillStyle = "black";
            render.lineWidth = "2";
            render.strokeStyle = "white";
            render.font = "12px monospace";

            render.fillRect(4, 138, 248, 50);
            render.strokeRect(4, 138, 248, 50);

            render.fillStyle = "white";
            render.fillText(event.text, 10, 156);

            if (event.speaker == "left") {

                const nameplate_width = event.left.length * 6 + 20;

                render.fillStyle = "black";
                render.fillRect(4, 113, nameplate_width, 25);
                render.strokeRect(4, 113, nameplate_width, 25);

                render.fillStyle = "white";
                render.fillText(event.left, 10, 131);

            } else if (event.speaker == "right") {

                const nameplate_width = event.right.length * 6 + 20;

                render.fillStyle = "black";
                render.fillRect(252 - nameplate_width, 113, nameplate_width, 25);
                render.strokeRect(252 - nameplate_width, 113, nameplate_width, 25);

                render.fillStyle = "white";
                render.fillText(event.right, 258 - nameplate_width, 131);
            }
        }

        function drawChoice(event) {

            render.fillStyle = "black";
            render.lineWidth = "2";
            render.strokeStyle = "white";
            render.font = "12px monospace";

            render.fillRect(4, 138, 248, 50);
            render.strokeRect(4, 138, 248, 50);

            for (let i = 0; i < event.choices.length; i++) {

                render.fillStyle = i == event.selected_i ? "yellow" : "white";
                render.fillText(event.choices[i].text, 10, 156 + 12 * i);
            }
        }
	</script>
</head>
<body onload="start();" style="margin: 0; justify-content: center; display: flex;">

    <script>
        // get the browser to load all the images
        for (key of Object.keys(gamedata.sprites))
            document.write(`<img src="${ key }" id="${ key }" style="display: none;">`); 
    </script>

    <canvas id="canvas" width="256" height="192" style="height: 100vh; margin: 0; image-rendering: pixelated;"></canvas>

</body>
</html>
